<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Arjit Singh</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Poppins:wght@400;600&display=swap");
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, rgba(106, 17, 203, 0.9), rgba(37, 117, 252, 0.9)),
        url("https://picsum.photos/1600/900?blur=4") no-repeat center/cover;
      color: #fff;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
    }

    .logo {
      font-weight: 700;
      font-size: 1.6rem;
      color: #ffdd57;
      text-shadow: 0 0 10px rgba(255, 221, 87, 0.6);
    }

    .nav a {
      margin-left: 1.5rem;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }

    .nav a:hover,
    .nav a.active {
      color: #ffdd57;
      text-shadow: 0 0 8px #ffdd57;
    }

    /* Page Title */
    .page-title {
      padding: 4rem 0 2rem;
      text-align: center;
      font-family: "Montserrat", sans-serif;
      color: #ffdd57;
      font-size: 2.6rem;
      text-shadow: 0 0 15px rgba(255, 221, 87, 0.5);
      letter-spacing: 1px;
    }

    /* Contact Section */
    .contact-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      margin-bottom: 4rem;
    }

    /* Contact Form */
    .contact-form {
      flex: 1 1 420px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
      transition: 0.4s ease;
    }

    .contact-form:hover {
      box-shadow: 0 0 30px rgba(255, 221, 87, 0.4);
      transform: translateY(-3px);
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 12px;
      outline: none;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: #222; /* darker placeholder */
      font-weight: 500;
      opacity: 0.8;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 12px #ffdd57;
    }

    .contact-form button {
      background: #ffdd57;
      color: #333;
      padding: 1rem;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
      letter-spacing: 1px;
    }

    .contact-form button:hover {
      background: #ffc107;
      transform: translateY(-3px);
      box-shadow: 0 0 15px #ffdd57;
    }

    .contact-form button i {
      margin-right: 8px;
    }

    /* Contact Info */
    .contact-info {
      flex: 1 1 300px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      transition: 0.4s;
    }

    .contact-info:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(255, 221, 87, 0.4);
    }

    .contact-info h3 {
      font-size: 1.7rem;
      color: #ffdd57;
      margin-bottom: 1rem;
      text-shadow: 0 0 8px rgba(255, 221, 87, 0.4);
    }

    .info-item {
      margin: 1rem 0;
      font-size: 1rem;
    }

    .info-item i {
      color: #ffdd57;
      margin-right: 10px;
    }

    /* Social Icons */
    .socials {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .socials a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffdd57;
      color: #111;
      font-size: 1.3rem;
      transition: 0.3s ease;
      text-decoration: none;
    }

    .socials a:hover {
      background: #ffc107;
      transform: scale(1.1) rotate(8deg);
      box-shadow: 0 0 20px #ffdd57;
    }

    footer {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: #ddd;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .contact-section {
        flex-direction: column;
      }
      .page-title {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container header-inner">
      <div class="logo">Arjit Singh</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Page Title -->
  <h1 class="page-title">Get in Touch</h1>

  <!-- Contact Section -->
  <div class="container contact-section">
    <!-- Form -->
    <div class="contact-form">
      <form action="#" method="post">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
      </form>
    </div>

    <!-- Info -->
    <div class="contact-info">
      <h3>Connect With Me</h3>
      <div class="info-item"><i class="fa-solid fa-envelope"></i> tomararjit110@gmail.com</div>
      <div class="info-item"><i class="fa-solid fa-phone"></i> +91 98387 50828</div>
      <div class="info-item"><i class="fa-solid fa-location-dot"></i> Sitapur, Uttar Pradesh, India</div>

      <div class="socials">
        <a href="https://www.linkedin.com/in/arjit-singh-8324731a7/" target="_blank"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href=" https://github.com/arjit-web" target="_blank"><i class="fa-brands fa-github"></i></a>
        <a href="mailto:tomararjit110@email.com"><i class="fa-solid fa-envelope"></i></a>
        <a href="CV.pdf" download><i class="fa-solid fa-file-arrow-down"></i></a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    © <span id="year"></span> Arjit Singh | All Rights Reserved
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
